[package]
name = "game"
autotests = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The rules engine: game state, the actions of the lexicon performed as events, and card text run from its parsed form"

[lints]
workspace = true

[features]
profile = []

[dependencies]
ir = { path = "../ir" }
grammar = { path = "../grammar" }
oracle = { path = "../oracle" }
rayon = "1"
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# the rules test executable's modules, one per test file (crates/test-modules)
test-modules = { path = "../test-modules" }

[[test]]
name = "rules"
path = "tests/rules.rs"
